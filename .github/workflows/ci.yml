name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: car_rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d car_rental_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/car_rental_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python source tests
        run: python -m pytest -q

  dbt-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-databricks.txt

      - name: Install Databricks dbt dependencies
        run: python -m pip install -r requirements-databricks.txt

      - name: Parse dbt project
        run: >-
          dbt parse
          --project-dir car_rental_dbt
          --profiles-dir .github/dbt
          --no-partial-parse
