name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: car_rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d car_rental_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/car_rental_test
      DB_HOST: localhost
      DB_PORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: car_rental_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure dbt profile
        shell: bash
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'EOF'
          car_rental_dbt:
            target: dev
            outputs:
              dev:
                type: postgres
                host: "{{ env_var('DB_HOST') }}"
                user: "{{ env_var('PGUSER') }}"
                password: "{{ env_var('PGPASSWORD') }}"
                port: "{{ env_var('DB_PORT') | int }}"
                dbname: "{{ env_var('DB_NAME') }}"
                schema: warehouse
                threads: 1
          EOF

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate dbt configuration
        run: dbt debug --project-dir car_rental_dbt

      - name: Run pipeline
        run: python -m etl.main

      - name: Run dbt tests
        run: dbt test --project-dir car_rental_dbt
